[package]
name         = "financecalc"
version      = "0.1.0"
description  = "FinanceCalc — My Money"
authors      = ["Semtexhigh"]
edition      = "2021"
rust-version = "1.77"

[lib]
name       = "financecalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                 = { version = "2", features = [] }
tauri-plugin-updater  = "2"
tauri-plugin-dialog   = "2"
tauri-plugin-fs       = "2"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
tokio                 = { version = "1", features = ["sync"] }
base64                = "0.22"
# rustls rather than the system TLS stack: one fewer thing that has to be
# present on the build machine, and the same bytes on every platform.
reqwest               = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
