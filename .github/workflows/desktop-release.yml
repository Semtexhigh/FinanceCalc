# FinanceCalc desktop — build the macOS .dmg on a macOS runner and publish it.
# Copyright (c) 2026. All rights reserved.
#
# Tag to release:   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# Or run by hand:   Actions -> desktop-release -> Run workflow
#
# Signing is automatic when the Apple secrets exist. Without them the build
# still produces a .dmg; macOS will warn on first open until the secrets are added.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve signing secrets
        id: flags
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # A variable set to "" still counts as SET to the Tauri bundler, which then
          # tries to codesign with an empty certificate and dies. `secrets` is also not
          # a valid context in a step `if`. So: read the secrets here, export each one
          # to later steps ONLY when it actually has a value, and publish booleans the
          # `if` conditions can use.
          export_if_set() {
            [ -n "$2" ] || return 0
            {
              echo "$1<<__EOV__"
              printf '%s\n' "$2"
              echo "__EOV__"
            } >> "$GITHUB_ENV"
          }
          export_if_set APPLE_CERTIFICATE                   "$IN_APPLE_CERTIFICATE"
          export_if_set APPLE_CERTIFICATE_PASSWORD          "$IN_APPLE_CERTIFICATE_PASSWORD"
          export_if_set APPLE_SIGNING_IDENTITY              "$IN_APPLE_SIGNING_IDENTITY"
          export_if_set APPLE_ID                            "$IN_APPLE_ID"
          export_if_set APPLE_PASSWORD                      "$IN_APPLE_PASSWORD"
          export_if_set APPLE_TEAM_ID                       "$IN_APPLE_TEAM_ID"
          export_if_set TAURI_SIGNING_PRIVATE_KEY           "$IN_TAURI_SIGNING_PRIVATE_KEY"
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD  "$IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$IN_APPLE_CERTIFICATE" ]; then
            echo "has_apple=true"  >> "$GITHUB_OUTPUT"; echo "apple signing   : on"
          else
            echo "has_apple=false" >> "$GITHUB_OUTPUT"; echo "apple signing   : off (unsigned build)"
          fi
          if [ -n "$IN_TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "has_updater_key=true"  >> "$GITHUB_OUTPUT"; echo "updater signing : on"
          else
            echo "has_updater_key=false" >> "$GITHUB_OUTPUT"; echo "updater signing : off (dmg only, no auto-update)"
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Rust (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI and terser
        run: npm install -g @tauri-apps/cli@^2 terser

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#desktop-v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Stamp version into tauri.conf.json and Cargo.toml
        run: |
          python - <<'PY'
          import json, os, re
          v = "${{ steps.ver.outputs.version }}"
          p = "desktop/src-tauri/tauri.conf.json"
          c = json.load(open(p)); c["version"] = v
          json.dump(c, open(p, "w"), indent=2)
          t = open("desktop/src-tauri/Cargo.toml").read()
          t = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version      = "{v}"', t, count=1)
          open("desktop/src-tauri/Cargo.toml", "w").write(t)
          print("stamped", v)
          PY

      - name: Draw the icon and build icon.icns
        run: |
          python -m pip install --quiet pillow
          python desktop/tools/gen_icon.py
          cd desktop/src-tauri/icons
          rm -rf icon.iconset && mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s       icon.png --out "icon.iconset/icon_${s}x${s}.png"     >/dev/null
            sips -z $((s*2)) $((s*2)) icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset
          ls -la icon.icns

      - name: Regenerate provenance, frontend and manifest
        env:
          FINANCECALC_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python desktop/tools/gen_provenance.py
          python desktop/tools/prepare_frontend.py
          python desktop/tools/gen_manifest.py

      - name: Updater artifacts only when the signing key exists
        run: |
          python - <<'PY'
          import json
          # Tauri refuses to build when an updater pubkey is configured but there is
          # no private key to sign with. Rather than block the .dmg on a secret, turn
          # the updater ARTIFACTS off for an unsigned build. The pubkey still gets
          # compiled into the binary, so adding TAURI_SIGNING_PRIVATE_KEY later and
          # rebuilding switches auto-update on for copies installed from this build.
          p = "desktop/src-tauri/tauri.conf.json"
          c = json.load(open(p))
          has = "${{ steps.flags.outputs.has_updater_key }}" == "true"
          c["bundle"]["createUpdaterArtifacts"] = has
          json.dump(c, open(p, "w"), indent=2)
          print("updater artifacts:", "on" if has else "off - no signing key, dmg only")
          PY

      - name: Import Apple signing certificate (skipped if secrets absent)
        if: steps.flags.outputs.has_apple == 'true'
        run: |
          KC=build.keychain
          security create-keychain -p actions "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p actions "$KC"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KC"
          rm -f cert.p12

      - name: Build the app and .dmg
        working-directory: desktop
        run: tauri build --target universal-apple-darwin --verbose

      - name: Collect artefacts
        id: art
        run: |
          B=desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          find "$B" -name "*.dmg"        -exec cp {} out/ \;
          find "$B" -name "*.app.tar.gz" -exec cp {} out/ \;
          find "$B" -name "*.app.tar.gz.sig" -exec cp {} out/ \;
          cp PROVENANCE.json out/ 2>/dev/null || true
          ls -la out
          echo "dmg=$(ls out/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      - name: Sign the provenance manifest
        if: steps.flags.outputs.has_updater_key == 'true'
        run: |
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/updater.key
          tauri signer sign -f /tmp/updater.key -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" PROVENANCE.json || true
          rm -f /tmp/updater.key
          cp PROVENANCE.json out/ 2>/dev/null || true
          cp PROVENANCE.json.sig out/ 2>/dev/null || true

      - name: Build latest.json for the updater
        run: |
          python - <<'PY'
          import glob, json, os, datetime
          v   = "${{ steps.ver.outputs.version }}"
          tag = os.environ.get("GITHUB_REF_NAME", f"desktop-v{v}")
          if not tag.startswith("desktop-v"): tag = f"desktop-v{v}"
          sigs = glob.glob("out/*.app.tar.gz.sig")
          tgz  = glob.glob("out/*.app.tar.gz")
          if not sigs or not tgz:
              # Unsigned build: no update bundle exists, so do not publish a feed that
              # points at a file that is not there. The .dmg is still the deliverable.
              print("no signed update bundle - skipping latest.json")
              raise SystemExit(0)
          sig  = open(sigs[0]).read().strip()
          name = os.path.basename(tgz[0])
          url  = f"https://github.com/Semtexhigh/FinanceCalc/releases/download/{tag}/{name}"
          json.dump({
            "version": v,
            "notes": "FinanceCalc desktop",
            "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
              "darwin-aarch64": {"signature": sig, "url": url},
              "darwin-x86_64":  {"signature": sig, "url": url},
            },
          }, open("out/latest.json", "w"), indent=2)
          print("latest.json ->", url, "signed" if sig else "UNSIGNED")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: financecalc-macos-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "FinanceCalc desktop ${{ steps.ver.outputs.version }}" \
            --notes "macOS build. Download the .dmg.

          If macOS says the app is damaged or from an unidentified developer, this
          build is unsigned: right-click the app and choose Open, or run
          \`xattr -dr com.apple.quarantine /Applications/FinanceCalc.app\`.
          Adding the Apple signing secrets removes that step for good."
